<title>SHUpitcherhub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: clubhouse whiteboard — a fixed top bar, then one working column of panels; tables scroll inside their own frames. */
:root{
  --bg:#f5f4f3; --panel:#ffffff; --ink:#1d1a1b; --muted:#6b6466; --line:#e4dfdf; --soft:#efebea;
  --red:#c8102e; --red-ink:#ffffff; --red-soft:#fbe9ec;
  --good:#1f7a4d; --good-soft:#e3f3ea; --warn:#a96400; --warn-soft:#fdf0d9; --bad:#b4142f; --bad-soft:#fbe4e8;
  --t-rest:#9a9294; --t-recovery:#2f8f6b; --t-hybb:#3b6fb6; --t-hyba:#5b4bb0; --t-pen:#c07a12; --t-velo:#d2541c; --t-live:#c8102e; --t-rtt:#0e7c86;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141213; --panel:#1d1a1b; --ink:#f1ecec; --muted:#a59c9e; --line:#332e2f; --soft:#262223;
  --red:#e2344f; --red-ink:#ffffff; --red-soft:#3a1a20;
  --good:#4cc08a; --good-soft:#163024; --warn:#e6a23a; --warn-soft:#352612; --bad:#ff6b80; --bad-soft:#3a1820;
  --t-rest:#7c7476; --t-recovery:#46b88e; --t-hybb:#6a9be0; --t-hyba:#8f80e6; --t-pen:#e0a03c; --t-velo:#ef7a45; --t-live:#ff5069; --t-rtt:#35b3bd;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141213; --panel:#1d1a1b; --ink:#f1ecec; --muted:#a59c9e; --line:#332e2f; --soft:#262223;
  --red:#e2344f; --red-ink:#ffffff; --red-soft:#3a1a20;
  --good:#4cc08a; --good-soft:#163024; --warn:#e6a23a; --warn-soft:#352612; --bad:#ff6b80; --bad-soft:#3a1820;
  --t-rest:#7c7476; --t-recovery:#46b88e; --t-hybb:#6a9be0; --t-hyba:#8f80e6; --t-pen:#e0a03c; --t-velo:#ef7a45; --t-live:#ff5069; --t-rtt:#35b3bd;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font:700 24px/1 var(--f-display);letter-spacing:.01em;text-transform:none;display:flex;align-items:baseline;gap:2px;text-decoration:none}
.brand b{color:var(--red);font-weight:700}
.brand span{font-weight:600;opacity:.9}
.nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.nav a{font:600 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:9px 12px;border-radius:6px;opacity:.75}
.nav a:hover{opacity:1;background:rgba(127,127,127,.18)}
.nav a.on{opacity:1;background:var(--red);color:var(--red-ink)}
.who{display:flex;align-items:center;gap:10px;font-size:12px;opacity:.85}
.who button{background:transparent;border:1px solid currentColor;border-radius:6px;padding:4px 10px;cursor:pointer;color:inherit;opacity:.8}
.demo-band{background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.demo-band .wrap{padding-block:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo-band button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:2px 10px;cursor:pointer;color:inherit}

main{padding-block:22px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--muted)}
.eyebrow{font:600 12px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2,.panel>.spread{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=range]{accent-color:var(--red);width:100%}

/* day-type chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;color:#fff;white-space:nowrap;background:var(--t-rest)}
.chip.t-recovery{background:var(--t-recovery)}.chip.t-hybrid-b{background:var(--t-hybb)}.chip.t-hybrid-a{background:var(--t-hyba)}
.chip.t-bullpen{background:var(--t-pen)}.chip.t-velo{background:var(--t-velo)}.chip.t-live-game{background:var(--t-live)}.chip.t-return-to-throw{background:var(--t-rtt)}
.chip.none{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.role{background:var(--ink);color:var(--bg)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;background:var(--soft);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
td.r,th.r{text-align:right}

/* season strip */
.season{position:relative;height:64px;margin:6px 0 2px}
.season .bar{position:absolute;left:0;right:0;top:26px;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.season .seg{position:absolute;top:0;bottom:0}
.season .mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);white-space:nowrap}
.season .mk i{display:block;width:2px;height:44px;background:var(--line);margin-top:2px}
.season .mk.today{color:var(--red);font-weight:700}.season .mk.today i{background:var(--red)}
.countdown{display:flex;gap:28px;flex-wrap:wrap}
.countdown div{display:flex;flex-direction:column}
.countdown b{font:700 34px/1 var(--f-display)}
.countdown span{font-size:12px;color:var(--muted)}

/* flags */
.flags{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--soft);cursor:pointer;border-left:4px solid var(--muted)}
.flag.bad{border-left-color:var(--bad)}.flag.warn{border-left-color:var(--warn)}
.flag b{display:block}.flag small{color:var(--muted)}

/* dots, sparks */
.dots{display:flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:2px;background:var(--soft);display:block}
.dots i.ok{background:var(--good)}.dots i.mid{background:var(--warn)}.dots i.hi{background:var(--bad)}
.ci{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:5px;font:600 12px var(--f-mono);padding:0 6px}
.ci.ok{background:var(--good-soft);color:var(--good)}.ci.mid{background:var(--warn-soft);color:var(--warn)}.ci.hi{background:var(--bad-soft);color:var(--bad)}.ci.na{background:var(--soft);color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:76px repeat(7,minmax(92px,1fr)) 86px;gap:4px;min-width:820px}
.cal .h{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:4px 6px}
.cal .wk{font:500 12px var(--f-mono);color:var(--muted);padding:8px 4px}
.cal .d{background:var(--soft);border-radius:7px;padding:6px;min-height:74px;display:flex;flex-direction:column;gap:5px;cursor:pointer;border:1px solid transparent;position:relative}
.cal .d:hover{border-color:var(--muted)}
.cal .d.filled{border:1px dashed var(--muted);background:transparent}
.cal .d.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.cal .d .dn{font:500 11px var(--f-mono);color:var(--muted)}
.cal .d .meta{font-size:11px;color:var(--muted);line-height:1.3}
.cal .d .ci{position:absolute;top:5px;right:5px;height:18px;min-width:20px;font-size:11px}
.cal .tot{padding:8px 4px;font-size:12px;display:flex;flex-direction:column;gap:4px}

/* builder grid */
.bgrid{display:grid;grid-template-columns:58px repeat(7,minmax(112px,1fr)) 70px;gap:6px;min-width:920px;align-items:stretch}
.bgrid .bh{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.bgrid .wk{font-size:11.5px;color:var(--muted);padding:8px 0}.bgrid .tot{display:flex;flex-direction:column;gap:4px;padding:8px 0;font-size:12px}
.bday{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:7px 8px;min-height:92px;border-radius:8px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);font-size:12px;min-width:0}
.bday:hover{border-color:var(--muted);border-top-color:var(--tc)}.bday:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.bday.empty{background:var(--soft);border:1px dashed var(--line);border-top:4px solid var(--line);padding:7px 8px;text-align:left;align-items:stretch}.bday.empty .bd-add{align-self:center;margin-top:14px}.bd-top{display:flex;justify-content:space-between;gap:4px;color:var(--muted);font-size:11px}
.bd-mark{color:var(--red);font:600 10px var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:right}.bd-add{color:var(--muted);font-size:18px;line-height:1}
.bd-meta{font-size:11px;color:var(--muted)}.pv{display:block;font-size:11.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.pv b{font:600 10px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-right:3px}
.de{display:flex;flex-direction:column;gap:12px}.de-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.de-num{width:96px}.de-hint{margin:0;font-size:12px}
.de-sec{border:1px solid var(--line);border-radius:8px;overflow:hidden}.de-sec.open{border-color:var(--muted)}
.de-sech{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--soft)}
.de-sech .sub{font:12px var(--f-body);letter-spacing:0;text-transform:none}
.de-sec textarea{display:block;width:100%;border:0;border-radius:0;border-top:1px solid var(--line);padding:10px 12px;font:14px/1.5 var(--f-body);resize:vertical;min-height:0}
.de-tools{display:flex;gap:2px;flex-wrap:wrap;padding:4px 6px;border-top:1px solid var(--line)}.de-tools .btn[disabled]{opacity:.4}
.de-lib{padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.de-lib input{width:100%}
.de-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--panel);padding:10px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.de-more summary{cursor:pointer;color:var(--muted);font-size:13px}
.athlete-pick{display:flex;flex-wrap:wrap;gap:6px}
.athlete-pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;background:var(--panel)}
.athlete-pick input{accent-color:var(--red)}
.athlete-pick label.on{border-color:var(--red);background:var(--red-soft)}

/* cards */
.excard{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.excard header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--soft)}
.excard .exs{padding:4px 12px 10px}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .nm{font-weight:600}
.ex .dose{font:12px var(--f-mono);color:var(--muted);text-align:right}
.ex .nt{grid-column:1/-1;font-size:12px;color:var(--muted)}
.edit-ex{display:grid;grid-template-columns:2fr .6fr .8fr 1.2fr 2fr auto;gap:4px;margin:4px 0}
.edit-ex input{padding:5px 6px;font-size:12.5px}

/* today (athlete) */
.today-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.today-hero{grid-template-columns:1fr}}
.big-type{font:700 46px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.kv{display:flex;gap:22px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}.kv b{font:600 22px/1.1 var(--f-mono)}.kv span{font-size:12px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 0;font:600 14px var(--f-mono);cursor:pointer}
.scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick button{border:0;cursor:pointer;opacity:.45}
.typepick button.on{opacity:1;outline:2px solid var(--ink);outline-offset:1px}

/* drawer / toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-size:13px;max-width:calc(100% - 32px)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.login{max-width:420px;margin:8vh auto 0}
.drow{display:grid;grid-template-columns:2fr .5fr .6fr 1fr 2fr auto;gap:4px;margin:4px 0}.drow input{padding:5px 6px;font-size:12.5px;min-width:0}
.secbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.secbox h3{font-size:15px}
.cliprow{gap:6px}.cliprow .btn[disabled],.secbox .btn[disabled]{opacity:.4}
.libchips{max-height:220px;overflow-y:auto}.libchip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px;margin:0 4px 4px 0;font-size:12px;cursor:pointer}.libchip:hover{border-color:var(--red)}
.daynote{background:var(--red-soft);border-radius:8px;padding:10px 12px}.daynote b{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}.daynote p{margin:4px 0 0;white-space:pre-wrap}
.sec-h{font:600 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.vbox video{width:100%;max-height:480px;border-radius:8px;background:#000}
.bell{display:inline-flex;align-items:center;gap:6px}.bell b{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
@media (max-width:640px){.drow{grid-template-columns:1fr 1fr}.drow .dnote{grid-column:1/-1}}
.goalband{background:var(--ink);color:var(--bg);border-radius:var(--r);border-left:8px solid var(--red)}
.goalband-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px}
.gb-label{font:700 13px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.gb-list{display:flex;gap:10px 22px;flex-wrap:wrap;flex:1;min-width:0}
.gb-item{display:flex;align-items:center;gap:8px;font:600 20px/1.15 var(--f-display);letter-spacing:.01em}
.gb-n{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font:700 13px var(--f-mono);flex:none}
.gb-empty{opacity:.7}.gb-edit{background:transparent;color:inherit;border-color:currentColor}
.trow{display:grid;grid-template-columns:1.2fr 1.4fr .7fr .8fr auto;gap:4px}.trow input{min-width:0;padding:6px 7px}
.ladder{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.ladder span{display:flex;flex-direction:column;font:11px var(--f-mono);color:var(--muted);background:var(--soft);border-radius:6px;padding:4px 7px}.ladder span b{color:var(--ink);font-weight:500}.ladder span.on{background:var(--red-soft);outline:1px solid var(--red)}
@media (max-width:560px){.gb-item{font-size:17px}.trow{grid-template-columns:1fr 1fr}}
.ds-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;font:600 16px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.ds-head span{color:var(--muted);font-size:13px}
.ds-grid{columns:3 260px;column-gap:12px;--dsf:13px}
.daily{--dsf:13px}.ds-card{break-inside:avoid;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:var(--dsf);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.ds-card header{display:flex;justify-content:space-between;align-items:center;gap:6px}.ds-card .chip{font-size:11px;padding:3px 6px}
.ds-name{font:700 1.3em var(--f-display)}.ds-role{margin-left:6px;font:600 .8em var(--f-mono);color:var(--muted)}
.ds-meta{font:.85em var(--f-mono);color:var(--muted)}.ds-note{background:var(--red-soft);border-radius:5px;padding:3px 6px;white-space:pre-wrap}

/* ============================================================ state + backends */
const S={mode:null,me:{email:'',role:null,athleteId:null},athletes:[],programs:[],logs:[],templates:[],settings:{},logIdx:{},viewAs:null,videos:[]};

function types(){const t=(S.settings.workloadTypes&&S.settings.workloadTypes.length)?S.settings.workloadTypes:DEFAULT_TYPES;return t.some(x=>x.name===RTT)?t:[...t,DEFAULT_TYPES.find(x=>x.name===RTT)]}

/* Seed → rows (used both for demo and for the cloud import) */
function seedToRows(seed){
  const athletes=[],programs=[],logs=[];
  for(const p of seed.players){
    athletes.push({id:p.id,name:p.name,nickname:p.nickname||'',role:p.role||'',targets:p.targets||{},role_note:p.roleNote||'',email:'',
      profile:{goals:p.goals,warmup:p.warmup,warmupNote:p.warmupNote,cards:p.cards,rtt:p.rtt,drive:p.drive,velo:p.velo,fallWorkload:p.workloadTable||null},
      archive:p.archive});
    const days={};let first=null,last=null;
    for(const w of p.fallPlan||[]){ if(!w.start||w.start==='None')continue;
      w.days.forEach((t,i)=>{if(!t)return;const d=addDays(w.start,i);days[d]={type:t};first=!first||d<first?d:first;last=!last||d>last?d:last}); }
    if(first)programs.push({id:uid(),athlete_id:p.id,title:'Fall 2026 (from Google Sheet)',start_date:first,end_date:last,days,source:'drive',created_at:'2026-09-01T00:00:00Z'});
    for(const e of p.log||[]){ if(!e.date)continue;
      logs.push({id:uid(),athlete_id:p.id,date:e.date,type:null,checkin:typeof e.checkin==='number'?e.checkin:null,throws:null,intensity:null,
        innings:typeof e.innings==='number'?e.innings:null,pitches:typeof e.pitches==='number'?e.pitches:null,bullpen:e.bullpen!=null?String(e.bullpen):null,
        notes:[e.notes,(typeof e.checkin==='string'?'Check-in: '+e.checkin:null),(typeof e.innings==='string'?'Innings: '+e.innings:null),(typeof e.pitches==='string'?'Pitches: '+e.pitches:null)].filter(Boolean).join(' · ')||null,source:'drive'}); }
  }
  const settings={workloadTypes:seed.workloadTypes||DEFAULT_TYPES,library:seed.library||{},armCare:seed.armCare||{},calendar:seed.calendar||DEFAULT_CAL,masterTemplate:seed.masterTemplate||{}};
  return {athletes,programs,logs,settings};
}

/* ============================================================ workload math (same rules as the Google Sheet) */
function pts(t){const x=types().find(y=>y.name===t);return x&&x.load!=='auto'?+x.load:0}

/* Return-to-throw workload, per throw.
   Model from the published interval-throwing workload study (IJSPT): elbow varus torque per throw,
   flat ground by distance  τ = −0.000579x² + 0.194x + 36.23  (x in ft, 30–300),
   mound by effort          τ = 74 × (0.28·effort% + 72) / 100  (74 Nm = max-effort pitch),
   workload per throw = (τ/74)^1.3, summed for the day.
   K converts to the team's day-type points: 50 catch-play throws ≈ 8 (Hybrid B),
   a 75-pitch outing plus warm-up ≈ 25 (Live/Game). */
const K_PTS=0.27;
const tauDist=ft=>{const x=Math.max(30,Math.min(300,ft||60));return -0.000579*x*x+0.194*x+36.23};
const tauEffort=e=>74*(0.28*Math.max(0,Math.min(100,e))+72)/100;
const wThrow=t=>Math.pow(t/74,1.3);
function rttLoad(r,maxV){
  if(!r)return 0;const total=+r.throws||0;const it=Math.min(total||+r.intentThrows||0,+r.intentThrows||0);const low=Math.max(0,total-it);
  const eff=r.velo&&maxV?Math.min(100,r.velo/maxV*100):(r.effort!=null&&r.effort!==''?+r.effort:null);
  let s=low*wThrow(tauDist(r.dist||60));
  if(it)s+=it*wThrow(tauEffort(eff!=null?eff:80));
  return Math.round(s*K_PTS*10)/10;
}
/* A builder day typed "Return to throw" with only throws and effort %: ≤60% = catch play at 90 ft, above that = effort-based. */
function genericRttLoad(c){const n=+c.throws||0;if(!n)return 0;const e=c.intensity!=null&&c.intensity!==''?+c.intensity:null;
  return Math.round(n*(e!=null&&e>60?wThrow(tauEffort(e)):wThrow(tauDist(90)))*K_PTS*10)/10}
function cellLoad(c,maxV){if(!c||!c.type)return 0;if(c.type!==RTT)return pts(c.type);if(c.rtt)return rttLoad(c.rtt,maxV);return genericRttLoad(c)}
let HUBVELO={};
function maxVelo(aid){const a=athlete(aid);const o=a&&a.profile&&+a.profile.maxVelo;if(o)return o;if(!a)return null;const last=a.name.split(' ').slice(-1)[0].toLowerCase();return HUBVELO[last]||null}
async function loadHubVelo(){try{const r=await fetch(CLOUD.url+'/rest/v1/pt_state?id=eq.shu-main&select=data',{headers:{apikey:CLOUD.key,Authorization:'Bearer '+CLOUD.key}});if(!r.ok)return;const d=(await r.json())[0]?.data;if(!d)return;
  const v={};for(const x of d.roster||[]){let top=0;for(const q of d.outings||[]){if(q.pitcherId!==x.id)continue;for(const t of ['FB','SI']){const b=(q.byType||{})[t];if(b&&b.veloTop>top)top=b.veloTop}}if(top)v[String(x.name).split(' ').slice(-1)[0].toLowerCase()]=top}
  HUBVELO=v;if(S.me.role)render()}catch(e){}}

/* Read a return-to-throw sheet cell group into numbers the workload model can use. Best guess; the coach can edit each day. */
function parseRttDay(entries){
  const txt=entries.map(e=>e.text).join(' | ');
  if(!entries.length||entries.every(e=>/^\s*off\s*$/i.test(e.text)))return null;
  const byCat=c=>entries.filter(e=>new RegExp(c,'i').test(e.cat)).map(e=>e.text).join(' | ');
  const mid=(a,b)=>Math.round((+a+ +b)/2);
  let throws=null;const th=byCat('throw');
  let m;
  if((m=th.match(/(\d+)\s*-\s*(\d+)\s*total/i)))throws=mid(m[1],m[2]);
  else if((m=th.match(/(\d+)\s*total/i)))throws=+m[1];
  else if(/oz/i.test(th)&&(m=[...th.matchAll(/oz\s*(\d+)/gi)]).length)throws=m.reduce((s,x)=>s+ +x[1],0);
  else if((m=th.match(/(\d+)\s*-\s*(\d+)(?!\s*(ft|mph))/i)))throws=mid(m[1],m[2]);
  else if((m=th.match(/^\s*(\d+)\s*(?:total|throws)?\s*(?:\||$)/i)))throws=+m[1];
  if(throws==null){if((m=txt.match(/(\d+)\s*-\s*(\d+)\s*total/i)))throws=mid(m[1],m[2]);else{const t2=[...txt.matchAll(/(\d+)\s*(?:total\s*)?throws|(\d+)\s*total/gi)];if(t2.length){const x=t2[t2.length-1];throws=+(x[1]||x[2])}}}
  let velo=null;
  const vs=[...txt.matchAll(/(\d{2})\s*-\s*(\d{2})(?!\s*ft)/g)].map(x=>[+x[1],+x[2]]).filter(([a,b])=>a>=55&&b<=99&&b>=a);
  if((m=txt.match(/high\s*(\d)s?\s*low\s*(\d)s?/i)))velo=+m[1]*10+8;
  else if((m=txt.match(/low\s*(\d)0'?s/i)))velo=+m[1]*10+2;
  else if(vs.length)velo=Math.max(...vs.map(([a,b])=>mid(a,b)));
  else if((m=txt.match(/up to\s*(\d{2})/i)))velo=+m[1];
  let intent=null;
  if((m=txt.match(/last\s*(\d+)/i)))intent=+m[1];
  else if(velo&&(m=txt.match(/\d{2}\s*-\s*\d{2}[.,]?\s*(\d+)\s*(total|\.)/i)))intent=+m[1];
  const mound=/mound|slope/i.test(txt);
  if(velo&&intent==null)intent=mound?Math.min(15,throws||15):(throws||null);
  if(throws==null&&intent)throws=intent;
  const dists=[...txt.matchAll(/(\d+)\s*(?:-\s*(\d+))?\s*ft/gi)].map(x=>+(x[2]||x[1]));
  return {sections:entries,throws:throws||0,intentThrows:intent||0,velo:velo||null,dist:dists.length?Math.max(...dists):60,mound};
}
function rttToDays(rtt,startMonday,maxV){
  const days={};rtt.weeks.forEach((w,k)=>DAYS.forEach((d,i)=>{const date=addDays(startMonday,7*k+i);const e=w.days[d]||[];const r=parseRttDay(e);
    days[date]=r?{type:RTT,rtt:r,load:rttLoad(r,maxV),notes:`${w.label}`}:{type:'Rest',notes:`${w.label}${e.length?': '+e.map(x=>x.text).join(', '):''}`}}));
  return days;
}
/* The newest program whose date range covers the day decides that day, even if it leaves the day blank, so an old block never bleeds into a new one. */
function planDay(aid,date){let best=null,fill=null;for(const p of S.programs){if(p.athlete_id!==aid||!p.days)continue;
  if(p.source==='filled'){if(p.days[date])fill=p;continue}
  const inRange=p.start_date&&p.end_date?(date>=p.start_date&&date<=p.end_date):!!p.days[date];if(!inRange)continue;if(!best||String(p.created_at||'')>String(best.created_at||''))best=p}
  if(best&&best.days[date]&&(best.days[date].type||hasSecContent(best.days[date].sections)||best.days[date].dayNotes))return {...best.days[date],program:best};
  /* Filled-in days (inferred from pitch data and his fall pattern) only show where no real plan exists. */
  if(fill)return {...fill.days[date],program:fill,filled:true};
  return best&&best.days[date]?{...best.days[date],program:best}:null}
function logFor(aid,date){return S.logIdx[aid+'|'+date]||null}
function doneType(aid,date){const l=logFor(aid,date);if(l&&l.type)return l.type;const p=planDay(aid,date);return p?p.type:null}
function planLoad(aid,date){const p=planDay(aid,date);return p?cellLoad(p,maxVelo(aid)):0}
function dayLoad(aid,date){const l=logFor(aid,date);const p=planDay(aid,date);
  if(l&&l.type&&(!p||l.type!==p.type))return l.type===RTT?genericRttLoad({throws:l.throws,intensity:l.intensity}):pts(l.type);
  if(p&&p.type===RTT&&l&&l.throws!=null&&p.rtt&&p.rtt.throws)return Math.round(cellLoad(p,maxVelo(aid))*l.throws/p.rtt.throws*10)/10;
  return p?cellLoad(p,maxVelo(aid)):0}
function weekLoad(aid,ws,mode='actual'){let s=0;for(let i=0;i<7;i++){const d=addDays(ws,i);s+=mode==='plan'?planLoad(aid,d):dayLoad(aid,d)}return Math.round(s*10)/10}
function weekThrows(aid,ws){let s=0,any=false;for(let i=0;i<7;i++){const d=addDays(ws,i);const l=logFor(aid,d);const p=planDay(aid,d);const v=l&&l.throws!=null?l.throws:(p&&p.throws!=null?p.throws:null);if(v!=null){s+=+v;any=true}}return any?s:null}
function firstWeek(aid){let f=null;for(const p of S.programs)if(p.athlete_id===aid&&(!f||p.start_date<f))f=p.start_date;for(const l of S.logs)if(l.athlete_id===aid&&(!f||l.date<f))f=l.date;return f?monday(f):null}
/* Acute = this week's load. Chronic = average of up to 4 weeks ending this week (the sheet's formula). Flag outside 0.8–1.3. */
function acwr(aid,ws){const acute=weekLoad(aid,ws);const f=firstWeek(aid);const ls=[];for(let k=3;k>=0;k--){const w=addDays(ws,-7*k);if(f&&w<f)continue;ls.push(weekLoad(aid,w))}const chronic=ls.length?ls.reduce((a,b)=>a+b,0)/ls.length:0;return {acute,chronic,ratio:chronic?Math.round(acute/chronic*100)/100:null}}
const ratioCls=r=>r==null?'':(r<0.8||r>1.3)?'bad':'good';
function lastCheckin(aid){let best=null;for(const l of S.logs)if(l.athlete_id===aid&&l.checkin!=null&&(!best||l.date>best.date))best=l;return best}
function lastLog(aid){let best=null;for(const l of S.logs)if(l.athlete_id===aid&&(!best||l.date>best.date))best=l;return best}

function seasonStrip(){
  const cal=calendar();const start=addDays(TODAY,-14);const end=cal.reduce((m,c)=>c.date>m?c.date:m,TODAY);
  const span=daysBetween(start,end)||1;const x=d=>Math.max(0,Math.min(100,daysBetween(start,d)/span*100));
  const ramp=cal.find(c=>/ramp/i.test(c.label)),lb=cal.find(c=>/lives begin/i.test(c.label)),le=cal.find(c=>/lives end/i.test(c.label)),od=cal.find(c=>/opening/i.test(c.label));

    const plan=planDay(a.id,TODAY);const lc=lastCheckin(a.id);const ll=lastLog(a.id);const r=acwr(a.id,ws);
    const planned=weekLoad(a.id,ws,'plan');

    const flags=[];

    if(r.ratio!=null&&r.acute>0&&(r.ratio>1.3||r.ratio<0.8))flags.push(['warn','Load ratio '+r.ratio.toFixed(2),'This week '+r.acute+' vs 4-wk avg '+r.chronic.toFixed(1)]);

    if(a.email&&(since==null||since>=3))flags.push(['warn',since==null?'Hasn’t logged yet':`No log for ${since} days`,ll?'Last: '+md(ll.date):'']);
    return {a,plan,lc,ll,r,planned,dots,flags,since};
  });
}

function loadChart(aid){

  const data=weeks.map(w=>({w,done:w<=monday(TODAY)?weekLoad(aid,w):null,plan:weekLoad(aid,w,'plan'),ci:(()=>{const v=[];for(let i=0;i<7;i++){const l=logFor(aid,addDays(w,i));if(l&&l.checkin!=null)v.push(+l.checkin)}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null})()}));
  const W=900,H=200,L=34,R=34,T=14,B=26;const max=Math.max(60,...data.map(d=>Math.max(d.done||0,d.plan||0)));
  const bw=(W-L-R)/data.length;const y=v=>T+(H-T-B)*(1-v/max);const y2=v=>T+(H-T-B)*(1-v/10);
  let g='';for(const t of [0,max/2,max].map(Math.round))g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  for(const t of [0,5,10])g+=`<text x="${W-R+6}" y="${y2(t)+4}">${t}</text>`;

    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:620px;height:auto" role="img" aria-label="Weekly workload points">${g}</svg></div>`;

function renderSheet(cells){

  let maxR=0,maxC=0;const m={};for(const k of keys){const [,c,r]=k.match(/^([A-Z]+)(\d+)$/);const ci=colN(c),ri=+r;if(ri>400)continue;maxR=Math.max(maxR,ri);maxC=Math.max(maxC,ci);m[ri+'|'+ci]=cells[k]}
  let h='<div class="tbl-wrap" style="max-height:560px"><table class="sheet"><thead><tr><th></th>';for(let c=1;c<=maxC;c++)h+=`<th>${colS(c)}</th>`;h+='</tr></thead><tbody>';
  for(let r=1;r<=maxR;r++){let any=false,row=`<tr><th>${r}</th>`;for(let c=1;c<=maxC;c++){const v=m[r+'|'+c];if(v!=null)any=true;row+=`<td>${v==null?'':esc(typeof v==='string'&&v.startsWith('=')?'':v)}</td>`}if(any)h+=row+'</tr>'}
  return h+'</tbody></table></div>';
}

async function hydrateAttachments(root){
  for(const t of (root||document).querySelectorAll('.atile[data-apath]')){if(t.dataset.done)continue;t.dataset.done='1';
    const src=await videoSrc({path:t.dataset.apath});const th=t.querySelector('.athumb');if(!src){th.textContent='—';continue}
    if(t.dataset.akind==='image')th.innerHTML=`<img src="${esc(src)}" alt="">`;

function bindAttach(prefix,aid,date,after){
  const inp=$('#'+prefix+'file');if(!inp)return;hydrateAttachments($('#'+prefix+'att'));
  inp.onchange=async()=>{const files=[...inp.files];inp.value='';if(!files.length)return;const msg=$('#'+prefix+'amsg');
    if(S.mode!=='cloud'){msg.textContent='Uploads work on the live site, not the preview.';return}
    const ok=[],bad=[];
    for(const [i,f] of files.entries()){if(f.size>MAXFILE){bad.push(`${f.name} is over 50 MB`);continue}
      msg.textContent=`Uploading ${i+1} of ${files.length}…`;
      const path=`${aid}/logs/${date}/${Date.now()}-${f.name.replace(/[^\w.-]+/g,'_')}`;
      const {error}=await sb.storage.from('videos').upload(path,f,{contentType:f.type||'application/octet-stream'});
      if(error)bad.push(`${f.name}: ${error.message}`);else ok.push({path,name:f.name,type:f.type||'',size:f.size,at:new Date().toISOString(),by:S.me.email})}
    if(ok.length){const ex=logFor(aid,date);const list=[...((ex&&ex.attachments)||[]),...ok];
      try{await API.saveLog({athlete_id:aid,date,attachments:list})}catch(e){bad.push(e.message)}}
    msg.textContent=bad.length?bad.join(' · '):`Added ${ok.length} file${ok.length===1?'':'s'}.`;

}

/* Target ramp: dated steps that build to the Opening Day target. The current target is the latest step on or before today. */
function targetSteps(a){return ((a.profile||{}).targetPlan||[]).filter(x=>x.date).sort((x,y)=>x.date.localeCompare(y.date))}
function targetNow(a,date=TODAY){const st=targetSteps(a);let cur=null,next=null;for(const x of st){if(x.date<=date)cur=x;else if(!next)next=x}return {cur,next,final:a.targets||{}}}
const tgtTxt=t=>t&&(t.ip||t.pitches)?`${t.ip!=null&&t.ip!==''?t.ip+' IP':''}${t.ip&&t.pitches?' · ':''}${t.pitches?t.pitches+' pitches':''}`:'—';
function suggestRamp(a){
  const fin=a.targets||{};const ip=+fin.ip||(a.role==='SP'?5:1);const pc=+fin.pitches||Math.round(ip*15);
  const cal=calendar();const lb=(cal.find(c=>/lives begin/i.test(c.label))||{}).date||'2027-01-19';const od=(cal.find(c=>/opening/i.test(c.label))||{}).date||'2027-02-19';
  const le=(cal.find(c=>/lives end/i.test(c.label))||{}).date||od;
  const weeks=[];for(let d=lb;d<le&&d<od;d=addDays(d,7))weeks.push(d);
  const startIp=Math.min(ip,1),startPc=Math.min(pc,a.role==='SP'||ip>=2?20:15);
  const steps=weeks.map((d,i)=>{const f=weeks.length?i/weeks.length:0;return {date:d,label:`Lives wk ${i+1}`,ip:Math.max(1,Math.round(startIp+(ip-startIp)*f)),pitches:Math.round((startPc+(pc-startPc)*f)/5)*5}});
  steps.push({date:od,label:'Opening Day',ip,pitches:pc});return steps;
}

    <p class="sub" style="margin:0;font-size:12.5px">Each step is his target from that date until the next one. "Suggest a build-up" spreads the lives weeks evenly up to the Opening Day target; edit any row after.</p>
    <div class="stack">${steps.length?steps.map((x,i)=>`<div class="trow" data-ti="${i}"><input type="date" data-k="date" value="${x.date||''}"><input type="text" data-k="label" value="${esc(x.label||'')}" placeholder="Label"><input type="number" step="0.1" data-k="ip" value="${x.ip??''}" placeholder="IP"><input type="number" data-k="pitches" value="${x.pitches??''}" placeholder="Pitches"><button class="btn small ghost" data-trm="${i}" aria-label="Remove">✕</button></div>`).join(''):'<div class="empty">No steps yet. He just has the Opening Day target.</div>'}</div>
    <div class="row"><button class="btn primary" id="tSave">Save targets</button></div>`);
    const sync=()=>{fin.ip=num($('#tIp').value);fin.pitches=num($('#tPc').value);document.querySelectorAll('.trow').forEach(r=>{const x=steps[+r.dataset.ti];r.querySelectorAll('input').forEach(inp=>x[inp.dataset.k]=inp.type==='number'?num(inp.value):inp.value)})};
    $('#tClose').onclick=closeLayer;
    $('#tAdd').onclick=()=>{sync();const last=steps[steps.length-1];steps.push({date:last?addDays(last.date,7):monday(TODAY),label:'',ip:last?last.ip:null,pitches:last?last.pitches:null});draw()};
    $('#tSuggest').onclick=()=>{sync();const tmp={...a,targets:fin};steps=suggestRamp(tmp);draw()};
    document.querySelectorAll('[data-trm]').forEach(b=>b.onclick=()=>{sync();steps.splice(+b.dataset.trm,1);draw()});
    $('#tSave').onclick=async()=>{sync();a.targets={...(a.targets||{}),ip:fin.ip,pitches:fin.pitches};a.role_note=$('#tNote').value.trim();a.profile=a.profile||{};a.profile.targetPlan=steps.filter(x=>x.date).sort((x,y)=>x.date.localeCompare(y.date));
      try{await API.saveAthlete(a);closeLayer();toast('Targets saved');render()}catch(e){toast(e.message)}};
  };draw();
}
function targetCard(a,coach){
  const {cur,next,final}=targetNow(a);const st=targetSteps(a);
  return `<div class="panel"><div class="spread"><div class="eyebrow">Game target</div>${coach?'<button class="btn small" id="editTargets">Edit</button>':''}</div>
    <div class="kv" style="margin-top:8px"><div><b>${cur?tgtTxt(cur):tgtTxt(final)}</b><span>${cur?esc(cur.label||'now')+' · since '+md(cur.date):'Opening Day target'}</span></div>
    ${next?`<div><b>${tgtTxt(next)}</b><span>next · ${esc(next.label||'')} ${md(next.date)}</span></div>`:''}</div>
    ${st.length?`<div class="ladder">${st.map(x=>`<span class="${cur&&x===cur?'on':''}" title="${esc(x.label||'')}">${md(x.date)}<b>${tgtTxt(x)}</b></span>`).join('')}</div>`:(coach?'<p class="sub" style="margin:8px 0 0;font-size:12.5px">No ramp-up steps yet. Tap Edit to build one.</p>':'')}

/* ============================================================ day sections + drill library */
const SECTIONS=[['prework','Pre-work'],['plyo','Plyo'],['throwing','Throwing'],['medball','Med ball'],['focus','Bullpen / live focus']];
const PLYO_RX=/plyo|pivot pick|roll-?in|reverse throw|walking windup|marshall|rocker|drop step|step.?in front|janitor|figure 8|wall throw|scap/i;
const SECLABEL=Object.fromEntries(SECTIONS);
function drillLib(){
  if(Array.isArray(S.settings.drillLibrary))return S.settings.drillLibrary;
  const seen=new Set(),out=[];const add=(name,section,notes)=>{const k=String(name||'').trim().toLowerCase();if(!k||seen.has(k))return;seen.add(k);out.push({name:String(name).trim(),section,notes:notes||''})};
  for(const a of S.athletes){const pr=a.profile||{};(pr.warmup||[]).forEach(e=>add(e.name,'prework'));Object.values(pr.cards||{}).forEach(c=>(c.exercises||[]).forEach(e=>add(e.name,/bullpen|live/i.test(e.name)?'focus':PLYO_RX.test(e.name)?'plyo':'throwing')))}
  ((S.settings.library||{}).drills||[]).forEach(n=>add(n,'plyo'));
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}
async function learnDrills(sections){
  if(!sections||S.me.role!=='coach')return;const lib=drillLib().slice();const have=new Set(lib.map(d=>d.name.toLowerCase()));let added=0;
  for(const [sec] of SECTIONS)for(const d of sections[sec]||[]){const k=(d.name||'').trim().toLowerCase();if(k&&!have.has(k)){have.add(k);lib.push({name:d.name.trim(),section:sec,notes:''});added++}}
  if(added||!Array.isArray(S.settings.drillLibrary)){lib.sort((a,b)=>a.name.localeCompare(b.name));await API.saveSetting('drillLibrary',lib)}
  return added;
}
let CLIP=null; /* {kind:'section'|'day', sec, label, items, notes, from} */
const hasSecContent=sec=>!!sec&&SECTIONS.some(([k])=>(sec[k]||[]).some(d=>d.name)||(sec[k+'Notes']||'').trim());
const drillCount=sec=>sec?SECTIONS.reduce((n,[k])=>n+((sec[k]||[]).filter(d=>d.name).length),0):0;
function sectionsHtml(day){
  const sec=day&&day.sections;if(!sec&&!(day&&day.dayNotes))return '';
  return `${day.dayNotes?`<div class="daynote"><b>Coach notes</b><p>${esc(day.dayNotes)}</p></div>`:''}${SECTIONS.filter(([k])=>sec&&(sec[k]||[]).some(d=>d.name)||(sec&&sec[k+'Notes'])).map(([k,l])=>`<div class="excard"><header><b class="sec-h">${l}</b>${sec[k+'Notes']&&(sec[k]||[]).some(d=>d.name)?`<span class="sub" style="font-size:12.5px">${esc(sec[k+'Notes'])}</span>`:''}</header><div class="exs">${sec[k+'Notes']&&!(sec[k]||[]).some(d=>d.name)?`<p style="margin:8px 0;white-space:pre-wrap">${esc(sec[k+'Notes'])}</p>`:''}${(sec[k]||[]).filter(d=>d.name).map(e=>`<div class="ex"><span class="nm">${esc(e.name)}</span><span class="dose">${esc([e.sets?e.sets+'×':'',e.reps||'',e.ball?' · '+e.ball:''].join(''))}</span>${e.notes?`<span class="nt">${esc(e.notes)}</span>`:''}</div>`).join('')}</div></div>`).join('')}`;
}
/* Day editor: drills by section, notes per drill, notes per section, overall day notes. onSave(day) persists it. */
/* ---------- one drill per line ⇄ structured drills ----------
   "Band series 2x10 - slow tempo"  → {name:"Band series", sets:2, reps:"10", notes:"slow tempo"}
   "Scoop toss 6 lb 2x5 each"       → {name:"Scoop toss", ball:"6 lb", sets:2, reps:"5 each"}
   "Note: max intent today"          → section note */
function lineToDrill(line){
  let t=line.trim().replace(/^[-•*]\s*/,'');if(!t)return null;let notes=null;
  const sp=t.split(/\s+[—–-]\s+/);if(sp.length>1){t=sp.shift().trim();notes=sp.join(' - ').trim()}
  let sets=null,reps=null,ball=null,m;
  if((m=t.match(/\b(\d+)\s*[x×]\s*(\d+(?:\s*-\s*\d+)?(?:\s*(?:each|ea|e\/s|per side|sec|secs|s|min|mins|ft|yd|yds|throws))?)\b/i))){sets=+m[1];reps=m[2].replace(/\s+/g,' ').trim();t=(t.slice(0,m.index)+t.slice(m.index+m[0].length))}
  if((m=t.match(/\b(\d+(?:\.\d+)?\s*(?:oz|lb|lbs|kg|g))\b/i))){ball=m[1].replace(/\s+/,' ');t=(t.slice(0,m.index)+t.slice(m.index+m[0].length))}
  const name=t.replace(/\s{2,}/g,' ').replace(/[,·@]\s*$/,'').trim()||line.trim();
  return {name,sets,reps,ball,notes};
}
const drillToLine=e=>[e.name,e.ball,e.sets&&e.reps?`${e.sets}x${e.reps}`:(e.reps||(e.sets?e.sets+' sets':''))].filter(Boolean).join(' ')+(e.notes?` - ${e.notes}`:'');
function secToText(sec,k){return [...(sec[k]||[]).filter(e=>e.name).map(drillToLine),...(sec[k+'Notes']?['Note: '+sec[k+'Notes']]:[])].join('\n')}
function textToSec(txt){const items=[],notes=[];for(const ln of String(txt||'').split('\n')){const m=ln.match(/^\s*notes?\s*:\s*(.*)$/i);if(m){if(m[1].trim())notes.push(m[1].trim());continue}const d=lineToDrill(ln);if(d)items.push(d)}return {items,note:notes.join(' ')}}

  };draw();
}


/* Save one day of a pitcher's plan. Edits the program that owns the date; if none, starts a one-day plan for him. Athlete edits are stamped so the coach sees them. */
async function editDayPlan(aid,date,day){
  const p=planDay(aid,date);const stamp=S.me.role==='coach'&&!S.viewAs?{}:{editedBy:S.me.email,editedAt:new Date().toISOString()};
  const body={type:day.type||null,sections:day.sections,dayNotes:day.dayNotes||''};if(day.throws!=null)body.throws=day.throws;else delete body.throws;if(day.intensity!=null)body.intensity=day.intensity;
  if(p){const prog=p.program;const old=prog.days[date]||{};const merged={...old,...body,...stamp};if(day.throws==null)delete merged.throws;if(day.intensity==null)delete merged.intensity;if(merged.type!==RTT)delete merged.rtt;prog.days[date]=merged;await API.saveProgram(prog)}
  else{const own=S.programs.find(x=>x.athlete_id===aid&&x.source==='athlete'&&x.start_date===monday(date));
    if(own){own.days[date]={...body,...stamp};await API.saveProgram(own)}
    else await API.saveProgram({id:uid(),athlete_id:aid,title:'My plan',start_date:monday(date),end_date:addDays(monday(date),6),days:{[date]:{...body,...stamp}},source:'athlete',created_at:new Date().toISOString()})}
}

function blankGrid(n){return Array.from({length:n},()=>Array.from({length:7},()=>({type:'',throws:null,intensity:null,notes:''})))}
function loadProgramIntoBuilder(p){
  const start=monday(p.start_date);const n=Math.max(1,Math.ceil((daysBetween(start,p.end_date)+1)/7));
  BUILD.grid=blankGrid(n);for(const d in p.days){const k=daysBetween(start,d);if(k<0)continue;BUILD.grid[Math.floor(k/7)][k%7]={type:'',throws:null,intensity:null,notes:'',...p.days[d]}}
  Object.assign(BUILD,{athletes:new Set([p.athlete_id]),title:p.title,start,weeks:n,editing:p.id});
}

function openBuilderDay(k,i){
  const c=BUILD.grid[k][i];const d=addDays(BUILD.start,7*k+i);
  window.__extra_copytype=async(day)=>{if(!day.type){toast('Pick a day type first');return}let n=0;Object.assign(c,{sections:day.sections,dayNotes:day.dayNotes,type:day.type,throws:day.throws,intensity:day.intensity});BUILD.grid.forEach(w=>w.forEach(x=>{if(x!==c&&x.type===day.type){x.sections=JSON.parse(JSON.stringify(day.sections));x.dayNotes=day.dayNotes;n++}}));closeLayer();drawBuilderGrid();toast(`Copied to ${n} other ${day.type} day${n===1?'':'s'}`)};
  window.__extra_copyweek=async(day)=>{let n=0;Object.assign(c,{sections:day.sections,dayNotes:day.dayNotes,type:day.type,throws:day.throws,intensity:day.intensity});BUILD.grid.forEach((w,kk)=>{if(kk===k)return;Object.assign(w[i],JSON.parse(JSON.stringify({type:day.type||'',sections:day.sections,dayNotes:day.dayNotes,throws:day.throws,intensity:day.intensity})));n++});closeLayer();drawBuilderGrid();toast(`Copied to ${DAYS[i]} of ${n} other week${n===1?'':'s'}`)};
  const total=BUILD.grid.length*7;const idx=k*7+i;
  dayEditor(`${dayName(d)} ${md(d)}`,c,async(day)=>{c.sections=day.sections;c.dayNotes=day.dayNotes;c.type=day.type||'';c.throws=day.throws;c.intensity=day.intensity;if(c.type!==RTT)delete c.rtt;drawBuilderGrid()},
    `<button class="btn small" data-extra="copytype">Use for every day of this type</button><button class="btn small" data-extra="copyweek">Use for every ${DAYS[i]}</button>`,
    {nav:dir=>{const n=idx+dir;if(n<0||n>=total){closeLayer();toast(n<0?'That’s the first day':'That’s the last day');return}openBuilderDay(Math.floor(n/7),n%7)}});
}
function drawBuilderGrid(){
  const first=[...BUILD.athletes][0];
  let h=`<div></div>${DAYS.map(d=>`<div class="bh">${d}</div>`).join('')}<div class="bh">Week</div>`;
  BUILD.grid.forEach((w,k)=>{const ws=addDays(BUILD.start,7*k);
    h+=`<div class="wk mono">Wk ${k+1}<br>${md(ws)}</div>`;
    w.forEach((c,i)=>{const d=addDays(ws,i);const mark=calendar().find(x=>x.date===d);const pv=cellPreview(c);
      const meta=[(c.rtt?c.rtt.throws:c.throws)?`${c.rtt?c.rtt.throws:c.throws} thr`:'',c.intensity?c.intensity+'%':''].filter(Boolean).join(' · ');
      h+=`<button type="button" class="bday ${c.type||pv||c.dayNotes?'':'empty'}" data-bday="${k}|${i}" style="--tc:${c.type?`var(--t-${TVAR[c.type]||'rest'})`:'var(--line)'}">
        <span class="bd-top"><span class="mono">${md(d)}</span>${mark?`<b class="bd-mark">${esc(mark.label)}</b>`:''}</span>
        ${c.type?chip(c.type):'<span class="bd-add">＋</span>'}
        ${meta?`<span class="mono bd-meta">${meta}</span>`:''}${c.dayNotes?`<span class="pv"><i>${esc(c.dayNotes)}</i></span>`:''}${pv}</button>`});
    const mv=first?maxVelo(first):null;const load=Math.round(w.reduce((s,c)=>s+cellLoad(c,mv),0)*10)/10;
    let ratio='';if(first){const hist=[];for(let j=3;j>=1;j--){const pw=addDays(ws,-7*j);const kk=k-j;hist.push(kk>=0?BUILD.grid[kk].reduce((s,c)=>s+cellLoad(c,mv),0):weekLoad(first,pw))}
      const arr=[...hist,load];const chronic=arr.reduce((a,b)=>a+b,0)/arr.length;const r=chronic?Math.round(load/chronic*100)/100:null;if(r!=null&&load)ratio=`<span class="pill ${ratioCls(r)}">${r.toFixed(2)}</span>`}
    h+=`<div class="tot"><span class="num"><b>${load}</b> pts</span>${ratio}</div>`});
  $('#bgrid').innerHTML=h;
  document.querySelectorAll('[data-bday]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.bday.split('|').map(Number);openBuilderDay(k,i)});
}
function newTemplate(){
  openLayer(`<h2>New template</h2><p class="sub" style="margin:0">Build a reusable plan (a week, a ramp-up, a return-to-throw block) and load it onto any pitcher later.</p>
    <label class="f">Template name<input type="text" id="ntName" placeholder="e.g. Starter 5-day week"></label>
    <label class="f">Weeks<input type="number" id="ntWeeks" min="1" max="20" value="1"></label>
    <label class="f">Start from<select id="ntFrom"><option value="blank">A blank grid</option><option value="grid">What's in the builder right now</option></select></label>
    <div class="row"><button class="btn primary" id="ntGo">Start building</button><button class="btn" id="ntNo">Cancel</button></div>`);
  $('#ntNo').onclick=closeLayer;
  $('#ntGo').onclick=()=>{const title=$('#ntName').value.trim()||'New template';const n=Math.max(1,Math.min(20,+$('#ntWeeks').value||1));const keep=$('#ntFrom').value==='grid'&&BUILD.grid;
    const g=keep?JSON.parse(JSON.stringify(BUILD.grid)).slice(0,n):blankGrid(n);while(g.length<n)g.push(blankGrid(1)[0]);
    Object.assign(BUILD,{tpl:{id:null,title},weeks:n,grid:g,editing:null,athletes:new Set()});closeLayer();builderView()};
}
async function saveTemplateFromBuilder(){
  const t=BUILD.tpl;const title=(t.title||'').trim();if(!title){toast('Give the template a name');return}
  const weeks=JSON.parse(JSON.stringify(BUILD.grid));
  try{await API.saveTemplate({id:t.id||uid(),title,weeks,created_at:new Date().toISOString()});toast(t.id?'Template updated':'Template saved');
    Object.assign(BUILD,{tpl:null,grid:null,title:'',weeks:4});builderView()}catch(e){toast(e.message)}
}
async function saveBuild(){
  const ids=[...BUILD.athletes];if(!ids.length){toast('Pick at least one pitcher');return}
  const title=BUILD.title.trim()||`Program from ${md(BUILD.start)}`;
  const days={};BUILD.grid.forEach((w,k)=>w.forEach((c,i)=>{if(!c.type&&!c.notes&&!hasSecContent(c.sections)&&!c.dayNotes)return;const o={type:c.type||null};if(c.throws!=null)o.throws=c.throws;if(c.intensity!=null)o.intensity=c.intensity;if(c.notes)o.notes=c.notes;if(c.rtt)o.rtt=c.rtt;if(hasSecContent(c.sections))o.sections=c.sections;if(c.dayNotes)o.dayNotes=c.dayNotes;days[addDays(BUILD.start,7*k+i)]=o}));
  if(!Object.keys(days).length){toast('Fill in at least one day');return}
  const end=addDays(BUILD.start,7*BUILD.weeks-1);
  try{
    if(BUILD.editing){const p=S.programs.find(x=>x.id===BUILD.editing);Object.assign(p,{title,start_date:BUILD.start,end_date:end,days:JSON.parse(JSON.stringify(days))});await API.saveProgram(p)}
    else for(const aid of ids){const ex=S.programs.find(p=>p.athlete_id===aid&&p.source==='app'&&p.title===title&&p.start_date===BUILD.start);
      if(ex){Object.assign(ex,{end_date:end,days:JSON.parse(JSON.stringify(days)),created_at:new Date().toISOString()});await API.saveProgram(ex)}
      else await API.saveProgram({id:uid(),athlete_id:aid,title,start_date:BUILD.start,end_date:end,days:JSON.parse(JSON.stringify(days)),source:'app',created_at:new Date().toISOString()})}
    toast(BUILD.editing?'Program updated':`Assigned to ${ids.length} pitcher${ids.length>1?'s':''}`);
    const back=ids.length===1?'p-'+ids[0]:'staff';Object.assign(BUILD,{grid:null,editing:null,title:''});BUILD.athletes=new Set();go(back);
  }catch(e){toast(e.message)}
}

async function addCoach(raw){
  const e=String(raw||'').trim().toLowerCase();if(!e){toast('Type their email');return}
  if(S.mode!=='cloud'){toast('Preview mode: coach not saved');return}
  const {data:isSet}=await sb.rpc('team_password_is_set');if(!isSet){openLayer(`<h2>Set the team password first</h2><p>Go to <b>Setup → Team password</b>, type it once, then add the coach.</p><div class="row"><a class="btn primary" href="#setup" onclick="closeLayer()">Open Setup</a></div>`);return}
  const {data,error}=await sb.rpc('add_coach',{target:e});if(error){toast(error.message);return}
  if(data==='that’s you'||data==="that's you"){toast('That’s your own email');loadCoaches();return}
  const {error:e2}=await sb.auth.signInWithOtp({email:e,options:{shouldCreateUser:false,emailRedirectTo:SITE_URL()+'?invite='+encodeURIComponent(e)}});
  const inp=$('#staffEmail');if(inp)inp.value='';
  if(e2)openLayer(`<h2>Coach added</h2><p>Their login is ready on the team password, but the email didn't send (${esc(/rate limit/i.test(e2.message)?'hourly email limit':e2.message)}).</p><p>Send them this link and tell them the team password:</p><p class="mono" style="word-break:break-all">${esc(SITE_URL()+'?invite='+encodeURIComponent(e))}</p><button class="btn" onclick="closeLayer()">Close</button>`);
  else toast(`Coach added · invite sent to ${e}`);
  loadCoaches();
}
/* After an email is saved, make sure he has a login on the team password (never touches anyone who chose his own). */
async function autoLogins(){if(S.mode!=='cloud')return null;const {data:isSet}=await sb.rpc('team_password_is_set');if(!isSet)return 'no-team-pw';const {data,error}=await sb.rpc('provision_roster');if(error)return null;return (data||[]).filter(r=>r.result==='created'||r.result==='set to team password').length}
async function loadLoginStatus(){
  if(S.mode!=='cloud')return;const {data,error}=await sb.rpc('account_status');if(error)return;const by=Object.fromEntries((data||[]).map(r=>[r.email,r]));
  document.querySelectorAll('[data-login]').forEach(td=>{const em=td.dataset.login;if(!em)return;const r=by[em];const extra=td.querySelector('div')?td.querySelector('div').outerHTML:'';

      (r&&r.last_sign_in?`<div class="sub" style="font-size:11.5px">Last in ${new Date(r.last_sign_in).toLocaleDateString()}</div>`:r&&r.has_login?'<div class="sub" style="font-size:11.5px">Hasn’t signed in</div>':'')+extra});

/* Invite = make sure his login exists on the team password, then email him a link to the sign-in page. */
async function sendInvites(list){
  if(S.mode==='demo'){toast('Preview mode: nothing sent');return}
  const {data:isSet}=await sb.rpc('team_password_is_set');if(!isSet){openLayer(`<h2>Set the team password first</h2><p>Go to <b>Setup → Team password</b>, type it once, then send invites.</p><div class="row"><a class="btn primary" href="#setup" onclick="closeLayer()">Open Setup</a></div>`);return}
  let ok=0,mailed=0;const fail=[];
  for(const a of list){
    try{await API.saveAthlete(a);const {error:e1}=await sb.rpc('reset_to_team_password',{target:a.email}).then(r=>r);if(e1)throw e1;ok++;
      const {error:e2}=await sb.auth.signInWithOtp({email:a.email,options:{shouldCreateUser:false,emailRedirectTo:SITE_URL()+'?invite='+encodeURIComponent(a.email)}});
      if(e2)fail.push(`${a.nickname||a.name}: login ready, but the email didn't send (${/rate limit/i.test(e2.message)?'hourly email limit':e2.message}). Text him the site link and the team password.`);
      else{mailed++;a.profile=a.profile||{};a.profile.invitedAt=new Date().toISOString();await API.saveAthlete(a)}}
    catch(e){fail.push(`${a.nickname||a.name}: ${e.message}`)}
  }
  if(fail.length)openLayer(`<h2>Invites</h2><p>${ok} login${ok===1?'':'s'} ready · ${mailed} email${mailed===1?'':'s'} sent.</p><ul>${fail.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><p class="sub">Site: <span class="mono">${esc(SITE_URL())}</span></p><button class="btn" onclick="closeLayer()">Close</button>`);
  else toast(`Invite${mailed>1?'s':''} sent to ${mailed} pitcher${mailed>1?'s':''}. Logins are ready.`);
  rosterView();
}

    <div class="panel stack"><h2>Arm care library</h2>${Object.entries(S.settings.armCare||{}).map(([k,rows])=>`<details><summary><b>${esc(k)}</b></summary><div class="tbl-wrap" style="margin-top:8px;max-height:420px"><table><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`).join('')||'<p class="sub">Import the Drive data to load the forearm and shoulder care tabs.</p>'}</div>
  </div>`;
  $('#wtSave').onclick=async()=>{const v=T.map((t,i)=>({...t,load:t.load==='auto'?'auto':(+document.querySelector(`[data-i="${i}"]`).value||0),rpe:document.querySelector(`[data-r="${i}"]`).value}));await API.saveSetting('workloadTypes',v);toast('Points saved')};
  $('#calSave').onclick=async()=>{const v=calendar().map((c,i)=>({date:document.querySelector(`[data-cd="${i}"]`).value,label:document.querySelector(`[data-cl="${i}"]`).value}));await API.saveSetting('calendar',v);toast('Dates saved')};
  if(S.mode==='cloud')sb.rpc('team_password_is_set').then(({data})=>{const el=$('#tpwState');if(el)el.textContent=data?'Team password is set.':'Not set yet.'});
  $('#tpwSave').onclick=async()=>{const v=$('#tpw').value;if(S.mode!=='cloud'){toast('Preview mode');return}const {error}=await sb.rpc('set_team_password',{pw:v});if(error){toast(error.message);return}$('#tpw').value='';$('#tpwState').textContent='Team password is set.';toast('Team password saved')};
  let DL=JSON.parse(JSON.stringify(drillLib()));
  const dlDraw=()=>{const f=($('#dlFilter').value||'').toLowerCase();$('#dlRows').innerHTML=DL.map((d,i)=>!f||d.name.toLowerCase().includes(f)?`<tr data-di="${i}"><td><input data-k="name" value="${esc(d.name)}" style="width:100%;min-width:180px"></td><td><select data-k="section">${SECTIONS.map(([k,l])=>`<option value="${k}" ${d.section===k?'selected':''}>${l}</option>`).join('')}</select></td><td><input data-k="notes" value="${esc(d.notes||'')}" style="width:100%;min-width:220px" placeholder="Cue or how-to"></td><td><button class="btn small ghost" data-dldel="${i}" aria-label="Remove">✕</button></td></tr>`:'').join('');
    document.querySelectorAll('#dlRows input,#dlRows select').forEach(x=>x.onchange=()=>{DL[+x.closest('tr').dataset.di][x.dataset.k]=x.value});
    document.querySelectorAll('[data-dldel]').forEach(b=>b.onclick=()=>{DL.splice(+b.dataset.dldel,1);dlDraw()})};
  dlDraw();$('#dlFilter').oninput=dlDraw;$('#dlAdd').onclick=()=>{DL.unshift({name:'New drill',section:'throwing',notes:''});$('#dlFilter').value='';dlDraw()};
  $('#dlSave').onclick=async()=>{DL=DL.filter(d=>d.name.trim()).sort((a,b)=>a.name.localeCompare(b.name));await API.saveSetting('drillLibrary',DL);toast('Library saved');dlDraw()};
  $('#seedGo').onclick=async()=>{const f=$('#seedFile').files[0];if(!f){toast('Choose shu-seed.json first');return}
    try{const seed=JSON.parse(await f.text());$('#seedMsg').textContent='Importing…';await importSeed(seed,m=>$('#seedMsg').textContent=m);}catch(e){$('#seedMsg').textContent='Import stopped: '+e.message}};
}
async function importSeed(seed,say){
  const r=seedToRows(seed);
  if(S.mode==='demo'){toast('Preview already uses this data');return}
  say('Saving pitchers…');
  for(const a of r.athletes){const ex=athlete(a.id);if(ex){a.email=ex.email||'';a.profile={...a.profile,...(ex.profile||{}),cards:{...(a.profile.cards||{}),...((ex.profile||{}).cards||{})}};a.role=ex.role||a.role;a.nickname=ex.nickname||a.nickname;a.targets=ex.targets&&Object.keys(ex.targets).length?ex.targets:a.targets}
    const {error}=await sb.from('athletes').upsert([a]);if(error)throw error}
  say('Saving fall programs…');
  for(const p of r.programs){if(S.programs.some(x=>x.athlete_id===p.athlete_id&&x.source==='drive'))continue;const {error}=await sb.from('programs').insert([p]);if(error)throw error}
  say('Saving check-ins…');
  const fresh=r.logs.filter(l=>!S.logIdx[l.athlete_id+'|'+l.date]);
  for(let i=0;i<fresh.length;i+=200){const {error}=await sb.from('logs').upsert(fresh.slice(i,i+200),{onConflict:'athlete_id,date',ignoreDuplicates:true});if(error)throw error}
  say('Saving library…');
  for(const [k,v] of Object.entries(r.settings)){if(k==='workloadTypes'&&S.settings.workloadTypes)continue;if(k==='calendar'&&S.settings.calendar)continue;const {error}=await sb.from('settings').upsert([{key:k,value:v}]);if(error)throw error}
  await cloudLoad();say(`Imported ${r.athletes.length} pitchers, ${fresh.length} check-ins.`);toast('Import complete');
}

/* ============================================================ athlete side */
function athleteToday(aid){
  const a=athlete(aid);if(!a){$('#app').innerHTML='<div class="empty">Your roster spot wasn’t found.</div>';return}
  const p=planDay(aid,TODAY);const prof=a.profile||{};const card=p&&p.type&&(prof.cards||{})[p.type];const t=types().find(x=>x.name===(p&&p.type));
  const ws=monday(TODAY);const logged=logFor(aid,TODAY);
  let strip='';for(let i=0;i<7;i++){const d=addDays(ws,i);const pp=planDay(aid,d);const l=logFor(aid,d);strip+=`<div class="d ${d===TODAY?'today':''}" data-day="${d}" data-aid="${aid}" style="min-height:70px"><span class="dn">${DAYS[i]} ${md(d)}</span>${chip((l&&l.type)||(pp&&pp.type))}${l&&l.checkin!=null?ciBadge(l.checkin):''}</div>`}
  const next=calendar().find(c=>c.date>=TODAY);
  $('#app').innerHTML=`<div class="stack">
    <div class="spread"><div><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><h1>${esc((a.nickname||a.name.split(' ')[0]))}, here's today</h1></div>
      ${next?`<span class="pill">${daysBetween(TODAY,next.date)} days to ${esc(next.label.toLowerCase())}</span>`:''}</div>
    ${goalsBanner(a,false)}
    <div class="today-hero">
      <div class="panel stack">
        <div class="spread"><div class="eyebrow">Today's throwing</div><button class="btn small" id="tEdit">${p?'Edit today’s plan':'Add today’s plan'}</button></div>
        ${p&&p.type?`<div class="big-type" style="color:var(--t-${TVAR[p.type]||'rest'})">${esc(p.type)}</div>`:'<div class="big-type sub">No plan today</div>'}
        <div class="kv">${t?`<div><b>${esc(t.rpe||'—')}</b><span>effort</span></div>`:''}${p&&p.intensity?`<div><b>${p.intensity}%</b><span>target effort</span></div>`:''}${p&&p.throws?`<div><b>${p.throws}</b><span>throws</span></div>`:''}${p&&p.rtt&&p.rtt.throws?`<div><b>${p.rtt.throws}</b><span>throws</span></div>`:''}${p&&p.rtt&&p.rtt.velo?`<div><b>${p.rtt.velo}</b><span>mph target${p.rtt.intentThrows&&p.rtt.intentThrows<p.rtt.throws?' · '+p.rtt.intentThrows+' throws':''}</span></div>`:''}${(()=>{const t=targetNow(a);const x=t.cur||t.final;return x&&(x.ip||x.pitches)?`<div><b>${tgtTxt(x)}</b><span>${t.cur?'current game target':'game target'}</span></div>`:''})()}</div>
        ${p&&p.notes?`<p style="margin:0"><b>Coach:</b> ${esc(p.notes)}</p>`:''}
        ${p?sectionsHtml(p):''}
        ${p&&p.rtt?rttDetailHtml(p,aid):''}
      </div>
      <div class="panel stack"><div class="spread"><h2>${logged?'Today’s log':'Log today'}</h2>${logged?'<span class="pill good">Logged</span>':''}</div>${voiceBlock('tl')}${logged&&logged.summary?logSummaryHtml(logged):''}${attachBlock('tl',aid,TODAY)}<details class="manual"${logged&&!logged.summary?' open':''}><summary>Or fill it in by hand</summary>${logForm(aid,TODAY,'tl')}</details><button class="btn primary" id="tSave">${logged?'Update log':'Save log'}</button></div>
    </div>
    <div class="panel"><h2>This week</h2><div style="overflow-x:auto"><div class="cal" style="grid-template-columns:repeat(7,minmax(92px,1fr));min-width:680px">${strip}</div></div></div>
    ${targetCard(a,false)}
    
  </div>`;
  bindLogForm('tl');bindVoice('tl',aid,TODAY,()=>athleteToday(aid));bindAttach('tl',aid,TODAY,()=>athleteToday(aid));
  $('#tEdit').onclick=()=>dayEditor(`${dayName(TODAY)} ${md(TODAY)}`,p?{...p,program:undefined}:{},async(day)=>{await editDayPlan(aid,TODAY,day);athleteToday(aid)});
  $('#tSave').onclick=async()=>{try{await API.saveLog(readLogForm('tl',aid,TODAY));toast('Logged. Coach can see it now.');athleteToday(aid)}catch(e){toast(e.message)}};
  document.querySelectorAll('.cal [data-day]').forEach(el=>el.onclick=()=>dayDrawer(aid,el.dataset.day));
}
function athleteHistory(aid){

  $('#app').innerHTML=`<div class="stack"><h1>My log</h1><div class="panel">${loadChart(aid)}</div>${logTab(a)}<div>${cardsTab(a,false)}</div></div>`;

/* ============================================================ boot */
async function boot(){
  try{const t=lsGet('shuhub_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  $('#brand').onclick=e=>{e.preventDefault();go(S.me.role==='athlete'||S.viewAs?'today':'staff')};
  if(window.__FORCE_DEMO__){const seed=await getSeed();Demo.start(seed);render();loadHubVelo();return}
  if(!window.supabase){S.mode=null;render();return}
  const RECOVERY=/type=recovery/.test(location.hash);
  sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
  const {data}=await sb.auth.getSession();
  if(data.session&&(RECOVERY||!(data.session.user.user_metadata||{}).pw_set)){setPasswordView(data.session.user.email,RECOVERY?'recovery':'new');return}
  if(data.session&&(data.session.user.user_metadata||{}).default_pw&&!sessionStorage.getItem('shuhub_pwSkip')){
    setPasswordView(data.session.user.email,'team',()=>{try{sessionStorage.setItem('shuhub_pwSkip','1')}catch(e){}location.reload()});return}
  if(data.session){S.mode='cloud';
    try{await cloudLoad()}catch(e){
      $('#app').innerHTML=`<div class="login stack"><h1>One setup step left</h1><div class="panel stack"><p style="margin:0">Signed in as <b>${esc(data.session.user.email)}</b>, but the hub's tables aren't in the database yet.</p><p class="sub" style="margin:0">Open Supabase → SQL Editor, paste <span class="mono">supabase/setup.sql</span> from this site's repo, put your email in the last line, and run it. Then reload.</p><p class="sub mono" style="margin:0;font-size:12px">${esc(e.message||e)}</p><button class="btn" onclick="signOut()">Sign out</button></div></div>`;return}
  }
  loadHubVelo();
  setInterval(pollUpdates,60000);
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='PASSWORD_RECOVERY'&&sess){setPasswordView(sess.user.email,'recovery');return}if(ev==='SIGNED_IN'&&S.mode!=='cloud')location.reload()});
  render();
}
boot();
</script>
